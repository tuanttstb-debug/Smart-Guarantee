# Smart Guarantee — Dify Workflow DSL v2 (import-ready)
#
# Thiết kế v2: Dify chỉ là PROXY LLM. Prompt nằm trong repo (gas/Prompt.gs, có version) và được GAS
# truyền vào input `system_prompt` → đổi prompt không cần sửa Dify. 1 node LLM (thay 4 node v1):
# nhanh hơn, rẻ hơn, ít điểm hỏng. Không dùng Code node (tránh sandbox 429 — TD-SG-08).
#
# Sau import: (1) chọn lại model ở node "LLM Extract" (khuyến nghị GPT-5.4-mini hoặc tương đương,
# temperature 0, bật JSON mode nếu provider hỗ trợ) → (2) Publish → (3) API Access: lấy key app-xxx
# → GAS Script Properties DIFY_API_KEY (DIFY_BASE_URL giữ nguyên), xoá DIFY_STUB.
# Output: `result` = JSON text đúng schema Prompt.gs (GAS parse + kiểm enum ở Extract.gs).
app:
  description: "TPBank — phân loại + bóc tách thư bảo lãnh (v2, prompt do GAS truyền vào)."
  icon: "🛡️"
  icon_background: "#7B2CBF"
  mode: workflow
  name: "Smart Guarantee v2"
kind: app
version: 0.1.5
workflow:
  environment_variables: []
  features:
    file_upload:
      image:
        enabled: false
    opening_statement: ""
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
  graph:
    edges:
      - id: e-start-llm
        source: start
        target: llm
        sourceHandle: source
        targetHandle: target
        type: custom
        data: { sourceType: start, targetType: llm, isInIteration: false }
      - id: e-llm-end
        source: llm
        target: end
        sourceHandle: source
        targetHandle: target
        type: custom
        data: { sourceType: llm, targetType: end, isInIteration: false }
    nodes:
      - id: start
        type: custom
        position: { x: 40, y: 300 }
        data:
          type: start
          title: "Start"
          desc: "Inputs từ GAS gateway"
          variables:
            - variable: system_prompt
              label: system_prompt
              type: paragraph
              required: true
              max_length: 20000
            - variable: raw_text
              label: raw_text
              type: paragraph
              required: true
              max_length: 60000
            - variable: today
              label: today
              type: text-input
              required: false
              max_length: 20
      - id: llm
        type: custom
        position: { x: 360, y: 300 }
        data:
          type: llm
          title: "LLM Extract"
          model:
            provider: openai
            name: gpt-4o-mini
            mode: chat
            completion_params:
              temperature: 0
              response_format: json_object
          context:
            enabled: false
            variable_selector: []
          vision:
            enabled: false
          prompt_template:
            - role: system
              text: "{{#start.system_prompt#}}"
            - role: user
              text: |
                Ngày hôm nay: {{#start.today#}}
                ===== VĂN BẢN THƯ (OCR) =====
                {{#start.raw_text#}}
                ===== HẾT =====
                Trả về JSON đúng schema.
      - id: end
        type: custom
        position: { x: 680, y: 300 }
        data:
          type: end
          title: "End"
          outputs:
            - variable: result
              value_selector: [llm, text]
