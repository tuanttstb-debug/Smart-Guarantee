# Smart Guarantee — Dify Workflow DSL (import-ready, LLM-only)
# Import: Dify Studio ▸ Import DSL ▸ upload. Sau import:
#   1) Đổi model mỗi node LLM sang provider đã cấu hình (đang để openai/gpt-4o placeholder).
#   2) Publish ▸ lấy API key + Base URL → GAS Script Properties DIFY_BASE_URL / DIFY_API_KEY,
#      xoá DIFY_STUB. (DIFY_BASE_URL = host gốc, vd https://api.dify.ai)
#
# ⚠️ KHÔNG dùng Code node (tránh sandbox 429 của Dify Cloud). Chỉ 4 LLM node.
# GAS (Dify.gs::normalizeDify_) tự suy ROUTE + parse JSON + assemble → API_CONTRACT.
# Luồng: start → classify → segment → extract → validate → end
# Mỗi LLM trả JSON (text). End xuất 4 output text: classification/segments/variables/validation.
app:
  description: "PoC TPBank — classify/segment/extract/validate thư bảo lãnh (LLM-only)."
  icon: "🛡️"
  icon_background: "#7B2CBF"
  mode: workflow
  name: "Smart Guarantee"
kind: app
version: 0.1.5
workflow:
  environment_variables: []
  features:
    file_upload:
      image:
        enabled: false
    opening_statement: ""
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
  graph:
    edges:
      - id: e-start-classify
        source: start
        target: classify
        sourceHandle: source
        targetHandle: target
        type: custom
        data: { sourceType: start, targetType: llm, isInIteration: false }
      - id: e-classify-segment
        source: classify
        target: segment
        sourceHandle: source
        targetHandle: target
        type: custom
        data: { sourceType: llm, targetType: llm, isInIteration: false }
      - id: e-segment-extract
        source: segment
        target: extract
        sourceHandle: source
        targetHandle: target
        type: custom
        data: { sourceType: llm, targetType: llm, isInIteration: false }
      - id: e-extract-validate
        source: extract
        target: validate
        sourceHandle: source
        targetHandle: target
        type: custom
        data: { sourceType: llm, targetType: llm, isInIteration: false }
      - id: e-validate-end
        source: validate
        target: end
        sourceHandle: source
        targetHandle: target
        type: custom
        data: { sourceType: llm, targetType: end, isInIteration: false }
    nodes:
      - id: start
        type: custom
        position: { x: 40, y: 300 }
        data:
          type: start
          title: "Start"
          desc: "Inputs từ GAS gateway"
          variables:
            - variable: raw_text
              label: raw_text
              type: paragraph
              required: true
              max_length: 48000
            - variable: paragraphs_json
              label: paragraphs_json
              type: paragraph
              required: false
              max_length: 48000
            - variable: config_json
              label: config_json
              type: paragraph
              required: false
              max_length: 48000
      - id: classify
        type: custom
        position: { x: 340, y: 300 }
        data:
          type: llm
          title: "LLM1 Classify"
          model:
            provider: openai
            name: gpt-4o
            mode: chat
            completion_params:
              temperature: 0
          context:
            enabled: false
            variable_selector: []
          vision:
            enabled: false
          prompt_template:
            - role: system
              text: |
                Bạn là chuyên gia nghiệp vụ bảo lãnh ngân hàng TPBank. Phân loại thư bảo lãnh theo các chiều.
                Chỉ trả JSON đúng schema (không markdown, không giải thích). Mã hợp lệ:
                guarantee_type ∈ [BLDT,BLBH,BLTH,BLTU,BLTT,BLKH]; method ∈ [TG,ĐT,SW]; language ∈ [TV,TA,SN,KH]
                template_type ∈ [TPB,T22,T07,T40,EVN,VIT,MK]; currency ∈ [VND,NGT]
                Nếu guarantee_type=BLDT thêm circular ∈ [TT06-07,TT22,TT40,TT79] và envelope. Trường không xác định để "".
                Schema: {"currency","guarantee_type","method","language","template_type","sector","validity_type","joint_venture","contract_status","circular","envelope"}
            - role: user
              text: |
                Nội dung thư:
                {{#start.raw_text#}}
      - id: segment
        type: custom
        position: { x: 640, y: 300 }
        data:
          type: llm
          title: "LLM2 Segment"
          model:
            provider: openai
            name: gpt-4o
            mode: chat
            completion_params:
              temperature: 0
          context:
            enabled: false
            variable_selector: []
          vision:
            enabled: false
          prompt_template:
            - role: system
              text: |
                Phân đoạn thư bảo lãnh thành KHUNG (văn bản mẫu cố định) và BIEN (chỗ cần điền: tên, số tiền,
                ngày, địa chỉ, tên gói thầu, số hợp đồng...). Giữ NGUYÊN VĂN và ĐẦY ĐỦ, đúng thứ tự.
                Mỗi BIEN đoán field_guess theo canonical_fields trong config. Chỉ trả JSON (không markdown).
                Schema: {"segments":[{"text","kind":"KHUNG"|"BIEN","field_guess","confidence":0-100}]}
            - role: user
              text: |
                config: {{#start.config_json#}}
                ---
                thư:
                {{#start.raw_text#}}
      - id: extract
        type: custom
        position: { x: 940, y: 300 }
        data:
          type: llm
          title: "LLM3 Extract+Map"
          model:
            provider: openai
            name: gpt-4o
            mode: chat
            completion_params:
              temperature: 0
          context:
            enabled: false
            variable_selector: []
          vision:
            enabled: false
          prompt_template:
            - role: system
              text: |
                Từ thư và danh sách BIEN, trích giá trị từng field áp dụng cho loại bảo lãnh (dùng field_requirements
                trong config theo guarantee_type). Chuẩn hoá tên field về canonical bằng field_aliases; chuẩn hoá số
                tiền và ngày (dd/mm/yyyy). Tự suy hệ biến từ classification:
                - Nếu currency=VND & language=TV & guarantee_type=BLDT → dùng $ND (nd_variable_map): key = $NDxxx.
                - Còn lại → dùng cụm [...] (placeholder_map): key = placeholder đại diện.
                Mỗi biến kèm confidence 0-100. Chỉ trả JSON (không markdown).
                Schema: {"variables":{"<key>":{"value","confidence"}}}
            - role: user
              text: |
                classification: {{#classify.text#}}
                config: {{#start.config_json#}}
                segments: {{#segment.text#}}
                thư: {{#start.raw_text#}}
      - id: validate
        type: custom
        position: { x: 1240, y: 300 }
        data:
          type: llm
          title: "LLM4 Validate"
          model:
            provider: openai
            name: gpt-4o
            mode: chat
            completion_params:
              temperature: 0
          context:
            enabled: false
            variable_selector: []
          vision:
            enabled: false
          prompt_template:
            - role: system
              text: |
                Kiểm tra: field bắt buộc còn thiếu (field_requirements theo guarantee_type), số tiền bằng số vs bằng
                chữ, ngày hợp lệ, hiệu lực hợp lý. Chỉ trả JSON (không markdown).
                Schema: {"missing":["field_code"],"warnings":["mô tả ngắn"]}
            - role: user
              text: |
                config: {{#start.config_json#}}
                classification: {{#classify.text#}}
                variables: {{#extract.text#}}
      - id: end
        type: custom
        position: { x: 1540, y: 300 }
        data:
          type: end
          title: "End"
          outputs:
            - variable: classification
              value_selector: [classify, text]
            - variable: segments
              value_selector: [segment, text]
            - variable: variables
              value_selector: [extract, text]
            - variable: validation
              value_selector: [validate, text]
